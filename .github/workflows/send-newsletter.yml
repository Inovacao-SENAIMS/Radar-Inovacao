name: Enviar newsletter após atualização da base

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simular o envio sem disparar e-mails'
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - 'data/editais.json'

concurrency:
  group: newsletter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      NEWSLETTER_API_KEY: ${{ secrets.NEWSLETTER_API_KEY }}

    steps:
      - name: Baixar versão publicada
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Enviar digest aos assinantes ativos
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            python scripts/send_newsletter.py --send --dry-run
          else
            python scripts/send_newsletter.py --send
          fi
